<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Medical App - Emergency Contacts</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Mobile App Frame */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
        }

        /* App Top Header Bar */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #e1e4e8;
        }

        .back-btn, .help-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .help-btn {
            width: 32px;
            height: 32px;
            background-color: #2979ff;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(41, 121, 255, 0.4);
        }

        /* Scrollable Content Area */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* Section Styling */
        .medical-section {
            margin-bottom: 20px;
        }

        .section-title-bar {
            background-color: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 4px 4px 0 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: -1px;
        }

        /* Individual Contact Item Container */
        .item-container {
            margin-bottom: 15px;
        }

        /* Static Header for Contact Relationship */
        .item-header {
            background-color: #e8eaed;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
            color: #202124;
            border: 1px solid #dcdfe4;
            border-radius: 6px 6px 0 0;
        }

        /* Card Content Box */
        .section-card {
            background-color: #f4f5f7;
            border: 1px solid #dcdfe4;
            border-top: none;
            border-radius: 0 0 6px 6px;
            overflow: hidden;
        }

        .data-row {
            display: flex;
            padding: 10px 15px;
            border-bottom: 1px solid #e1e4e8;
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .data-label {
            font-size: 10px;
            color: #5f6368;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .data-value {
            font-size: 13px;
            color: #202124;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <button class="back-btn" onclick="goBack()">&#8592;</button>
            <button class="help-btn" onclick="openHelp()">?</button>
        </div>

        <!-- Scrollable Body -->
        <div class="content-scroll">
            <div class="medical-section">
                <div class="section-title-bar">Emergency Contacts</div>

                <!-- 1. Wife -->
                <div class="item-container">
                    <div class="item-header">Wife</div>
                    <div class="section-card">
                        <div class="data-row">
                            <div class="data-group">
                                <span class="data-label">NAME:</span>
                                <span class="data-value">Kira</span>
                            </div>
                            <div class="data-group">
                                <span class="data-label">PHONE:</span>
                                <span class="data-value">0123456789</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. Brother -->
                <div class="item-container">
                    <div class="item-header">Brother</div>
                    <div class="section-card">
                        <div class="data-row">
                            <div class="data-group">
                                <span class="data-label">NAME:</span>
                                <span class="data-value">Jack Mart</span>
                            </div>
                            <div class="data-group">
                                <span class="data-label">PHONE:</span>
                                <span class="data-value">0123456789</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 3. Sister -->
                <div class="item-container">
                    <div class="item-header">Sister</div>
                    <div class="section-card">
                        <div class="data-row">
                            <div class="data-group">
                                <span class="data-label">NAME:</span>
                                <span class="data-value">Lou Jane</span>
                            </div>
                            <div class="data-group">
                                <span class="data-label">PHONE:</span>
                                <span class="data-value">0123456789</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 4. Friend 1 -->
                <div class="item-container">
                    <div class="item-header">Friend 1</div>
                    <div class="section-card">
                        <div class="data-row">
                            <div class="data-group">
                                <span class="data-label">NAME:</span>
                                <span class="data-value">Micheal</span>
                            </div>
                            <div class="data-group">
                                <span class="data-label">PHONE:</span>
                                <span class="data-value">0123456789</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 5. Friend 2 -->
                <div class="item-container">
                    <div class="item-header">Friend 2</div>
                    <div class="section-card">
                        <div class="data-row">
                            <div class="data-group">
                                <span class="data-label">NAME:</span>
                                <span class="data-value">Macbook</span>
                            </div>
                            <div class="data-group">
                                <span class="data-label">PHONE:</span>
                                <span class="data-value">0123456789</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = "patient-hello.html";
        }

        function openHelp() {
            window.location.href = "help.html";
        }
    </script>
</body>
</html>
