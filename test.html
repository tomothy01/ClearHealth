<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical ID</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        /* Fluid App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        /* Header Area */
        .app-header h2 {
            font-size: 28px;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        /* Structured Card */
        .info-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 24px;
            border: 1px solid #eaeaea;
        }

        .profile-name {
            font-size: 20px;
            font-weight: 700;
            color: #111;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-size: 15px;
        }

        .info-row .label {
            color: #666;
            font-weight: 500;
        }

        .info-row .value {
            color: #111;
            font-weight: 600;
        }

        /* Action Buttons Stack */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-btn {
            width: 100%;
            padding: 14px 16px;
            background-color: #2b4c5f;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 6px rgba(43, 76, 95, 0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        .app-btn:hover {
            background-color: #1e3543;
        }

        .app-btn:active {
            transform: scale(0.98);
        }

        .emergency-btn {
            background-color: #1d3557;
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Header -->
        <div class="app-header">
            <h2>Hey there!</h2>
        </div>

        <!-- Main Info Card -->
        <div class="info-card">
            <div class="profile-name">Tim Cook</div>
            
            <div class="info-row">
                <span class="label">DOB</span>
                <span class="value">26/12/2003</span>
            </div>

            <div class="info-row">
                <span class="label">NHS Number</span>
                <span class="value"><span>&#9658;</span> Hidden</span>
            </div>

            <div class="info-row">
                <span class="label">Blood Type</span>
                <span class="value">A-negative</span>
            </div>

            <div class="info-row">
                <span class="label">Gender</span>
                <span class="value">Male</span>
            </div>
        </div>

        <div class="button-group">
            <a href="allergy.html">
            <button class="app-btn">Allergies</button>
        </a>
        <a href="medication.html">
            <button class="app-btn">Medication</button>
        </a>
            <a href="vac.html">
            <button class="app-btn">Vaccinations</button>
        </a>
            <a href="emecont.html">
            <button class="app-btn emergency-btn">Emergency Contacts</button>
        </a>
        </div>

    </div>

</body>
</html>
